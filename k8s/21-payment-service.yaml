apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: splitpay
spec:
  replicas: 1
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      containers:
        - name: payment-service
          image: splitpay/payment-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: app-config, key: SPRING_KAFKA_BOOTSTRAP_SERVERS } }
            - name: SPRING_DATASOURCE_URL
              valueFrom: { configMapKeyRef: { name: app-config, key: PAYMENT_DB_URL } }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: db-credentials, key: PAYMENT_DB_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: PAYMENT_DB_PASSWORD } }
          readinessProbe:
            tcpSocket: { port: 8082 }
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: { memory: "384Mi" }
            limits: { memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: splitpay
spec:
  selector: { app: payment-service }
  ports:
    - port: 8082
