server:
  port: 8082
spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/payments
    username: payments
    password: payments
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.splitpay.payment.events.OrderPlacedEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: "*"

app:
  topics:
    orders-placed: orders.placed
    payment-results: payment.results
  retry:
    attempts: 3          # retries after the first failure, before the message goes to the dead-letter topic
    interval-ms: 2000
