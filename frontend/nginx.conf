# Serves the React app and forwards API calls to the services by their Kubernetes Service names.
# The browser only talks to nginx, so the services need no CORS settings.
server {
    listen 80;

    # /api/orders and /api/orders/5  ->  http://order-service:8081/orders and /orders/5
    location /api/orders {
        proxy_pass http://order-service:8081/orders;
    }

    # /api/payments?orderId=5  ->  http://payment-service:8082/payments?orderId=5
    location /api/payments {
        proxy_pass http://payment-service:8082/payments;
    }

    # React Router handles pages like /orders/5 in the browser, so any path that isn't a real
    # file gets index.html (otherwise refreshing /orders/5 would return 404).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
