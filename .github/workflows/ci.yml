# Runs on every push and pull request: Java tests, Lambda tests, front-end type check and build,
# Terraform validation, then builds the three Docker images (not pushed anywhere).
name: CI

on:
  push:
  pull_request:

jobs:
  java-tests:
    name: Java tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, payment-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: mvn -B test

  lambda-tests:
    name: Lambda tests (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws/lambdas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aws/lambdas/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-build:
    name: Front end type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  terraform-validate:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      # No AWS credentials needed: init without a backend, then check the configuration is valid.
      - run: terraform init -backend=false
      - run: terraform validate

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    # Only build images once the tests pass.
    needs: [java-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t splitpay/order-service:ci order-service
      - run: docker build -t splitpay/payment-service:ci payment-service
      - run: docker build -t splitpay/frontend:ci frontend
