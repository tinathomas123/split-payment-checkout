# One PostgreSQL container per service, plus a single-node Kafka broker.
services:
  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5433:5432"
    volumes:
      - order-data:/var/lib/postgresql/data

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5434:5432"
    volumes:
      - payment-data:/var/lib/postgresql/data

  # Kafka in KRaft mode (no ZooKeeper). The official image's defaults run a
  # single broker that the services reach at localhost:9092.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"

volumes:
  order-data:
  payment-data:
