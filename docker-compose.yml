# One PostgreSQL container per service, so each service owns its own database.
services:
  order-db:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5433:5432"
    volumes:
      - order-data:/var/lib/postgresql/data

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5434:5432"
    volumes:
      - payment-data:/var/lib/postgresql/data

volumes:
  order-data:
  payment-data:
